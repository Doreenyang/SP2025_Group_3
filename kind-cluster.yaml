kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088     # changed from 8080 to 8088
        protocol: TCP
      - containerPort: 443
        hostPort: 4443     # changed from 4433 to 4443
        protocol: TCP
