apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project-draft-ingress
spec:
  rules:
    - http:
        paths:
          - pathType: Prefix
            path: /api
            backend:
              service:
                name: project-draft
                port:
                  number: 3000
          - pathType: Prefix
            path: /
            backend:
              service:
                name: project-frontend
                port:
                  number: 3000

